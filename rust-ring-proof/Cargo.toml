[package]
name = "pbnjam-ring-proof"
version = "0.1.0"
edition = "2021"
description = "Rust connector for w3f ring proof (lines 299-316 logic)"

[lib]
name = "pbnjam_ring_proof"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
pbnjam-ring-proof-core = { path = "../rust-core" }

# SHA-512 for the spec A.1 transcript and RFC-9380 expand_message_xmd. No ark-vrf in src/vrf.
sha2 = { version = "0.10", default-features = false }
ark-ed-on-bls12-381-bandersnatch = { version = "0.5", default-features = true }
ark-serialize = { version = "0.5", default-features = true, features = ["derive"] }
ark-ff = { version = "0.5", default-features = true }
ark-ec = { version = "0.5", default-features = true }

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
