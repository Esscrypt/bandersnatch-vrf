name: Build and Release bandersnatch-vrf Binary

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build dependencies
        run: bun run build

      - name: Build bandersnatch-vrf binary
        run: bun run build:bin

      - name: Create checksum
        run: sha256sum bin/bandersnatch-vrf > bin/bandersnatch-vrf.sha256

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: bandersnatch-vrf-${{ github.sha }}
          name: bandersnatch-vrf ${{ github.sha }}
          body: |
            bandersnatch-vrf CLI binary built from commit ${{ github.sha }}

            ## Usage

            ```bash
            chmod +x bandersnatch-vrf
            ./bandersnatch-vrf --help
            ```
          draft: false
          prerelease: true
          files: |
            bin/bandersnatch-vrf
            bin/bandersnatch-vrf.sha256
